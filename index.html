<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAVE-SHARE — Conectando você ao seu comércio local</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, #217738 0%, #1b5e20 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .landing-card {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .logo-container {
            width: 76px;
            height: 76px;
            background-color: #2e7d32;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            fill: #ffffff;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1b1b1b;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: #217738;
        }

        .subtitulo {
            font-size: 15px;
            color: #666666;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            max-width: 110px;
        }

        .feature-icone {
            width: 42px;
            height: 42px;
            background-color: #f1f8e9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #217738;
        }

        .feature p {
            font-size: 12px;
            color: #757575;
            font-weight: 600;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primario {
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            background-color: #2e7d32;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primario:hover {
            background-color: #1b5e20;
            transform: translateY(-1px);
        }

        .btn-secundario {
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            color: #217738;
            background-color: #ffffff;
            border: 1.5px solid #217738;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-secundario:hover {
            background-color: #f1f8e9;
        }

        .rodape {
            margin-top: 28px;
            font-size: 12px;
            color: #aaaaaa;
        }

        @media (max-width: 480px) {
            .landing-card {
                padding: 36px 24px;
            }

            h1 {
                font-size: 24px;
            }

            .features {
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="landing-card">

        <div class="logo-container">
            <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 3c-5 0-9 4-9 9 0 2.12.74 4.07 1.97 5.61L4.39 23.19l1.42 1.42 5.58-5.58C12.93 19.26 14.88 20 17 20c5 0 9-4 9-9 0-4.42-3.58-8-8-8zm0 15c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
            </svg>
        </div>

        <h1>SAVE<span>&</span>SHARE</h1>
        <p class="subtitulo">
            Conectando você ao comércio local. Descubra produtos frescos, apoie pequenos negócios e receba tudo com praticidade.
        </p>

        <div class="features">
            <div class="feature">
                <div class="feature-icone">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                </div>
                <p>Comércio local</p>
            </div>

            <div class="feature">
                <div class="feature-icone">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </div>
                <p>Compra fácil</p>
            </div>

            <div class="feature">
                <div class="feature-icone">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <p>Perto de você</p>
            </div>
        </div>

        <div class="botoes">
            <a href="public/login.html" class="btn-primario">Entrar</a>
            <a href="public/cadastro.html" class="btn-secundario">Criar conta</a>
        </div>

        <p class="rodape">Projeto de TCC — SENAI Salvador</p>

    </div>

</body>
</html>
