<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Endereço</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="body-login card-endereco">
        <h1 class="titulo">Endereço</h1>
        <p class="subtitulo">Preencha os dados de localização</p>

        <form method="post" class="form-login">

            <div class="form-row">
                <div class="form-grupo flex-2">
                    <label for="cep">CEP</label>
                    <div class="input-container sem-icone">
                        <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000" required>
                    </div>
                </div>

                <div class="form-grupo flex-1">
                    <label for="numero">Número</label>
                    <div class="input-container sem-icone">
                        <input type="text" id="numero" name="numero" placeholder="123" required>
                    </div>
                </div>
            </div>

       
            <div class="form-grupo">
                <label for="rua">Rua</label>
                <div class="input-container sem-icone">
                    <input type="text" id="rua" name="rua" placeholder="Nome da rua" required>
                </div>
            </div>

            <div class="form-grupo">
                <label for="bairro">Bairro</label>
                <div class="input-container sem-icone">
                    <input type="text" id="bairro" name="bairro" placeholder="Bairro" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-grupo flex-2">
                    <label for="cidade">Cidade</label>
                    <div class="input-container sem-icone">
                        <input type="text" id="cidade" name="cidade" placeholder="Cidade" required>
                    </div>
                </div>

                <div class="form-grupo flex-1">
                    <label for="estado">UF</label>
                    <div class="input-container sem-icone">
                        <input type="text" id="estado" name="estado" maxlength="2" placeholder="SP" required>
                    </div>
                </div>
            </div>

            <div class="form-grupo">
                <label for="complemento">Complemento (opcional)</label>
                <div class="input-container sem-icone">
                    <input type="text" id="complemento" name="complemento" placeholder="Apto, Bloco, etc.">
                </div>
            </div>

            <button type="submit" class="btn-entrar">Cadastrar Endereço</button>
        </form>
    </div>

    <script src="viacepbusca.js"></script>
</body>
</html>
