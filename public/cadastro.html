<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de usuário</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="body-login">
    

    <div class="card-login">
    <div class="container">
        <h1 style="font-size: 32px;">Cadastro de Usuário</h1>
    </div>
    <form id="form-cadastro" class="form-inicial">
        <div class="form-grupo">

        <label for="nome">Nome completo</label>
        <div class="input-container sem-icone">
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </div>
        </div>


        <div class="form-grupo">
        <label for="telefone">Telefone</label>
        <div class="input-container sem-icone">
                    <input type="tel" id="telefone" name="telefone" placeholder="7199999999" required>
                </div>
        </div>
        <div class="form-grupo">
        <label for="email">Email</label>
        <div class="input-container sem-icone">
                    <input type="text" id="email" name="email" placeholder="seuemail@gmail" required>
                </div>
        </div>
        <!-- Seleção Cliente / Comerciante -->
            <div class="form-grupo">
                <p class="label-tipo">Você é:</p>
                <div class="tipo-usuario-options">
                    <input type="radio" id="cliente" name="tipo_usuario" value="cliente" checked hidden>
                    <label for="cliente" class="btn-tipo">Cliente</label>

                    <input type="radio" id="comerciante" name="tipo_usuario" value="comerciante" hidden>
                    <label for="comerciante" class="btn-tipo">Comerciante</label>
                </div>
            </div>
        <!-- Campos para Cliente (Exibidos por padrão) -->
            <div id="campos-cliente">
                <div class="form-row">
                    <div class="form-grupo flex-1">
                        <label for="cpf">CPF</label>
                        <div class="input-container sem-icone">
                            <input 
                            type="text" 
                            id="cpf" 
                            name="cpf" 
                            placeholder="000.000.000-00">
                        </div>
                    </div>

                    <div class="form-grupo flex-1">
                        <label for="data-nascimento-cli">Nascimento</label>
                        <div class="input-container sem-icone">
                            <input 
                            type="date" 
                            id="data-nascimento-cli" 
                            name="data_nascimento_cliente">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Campos para Comerciante (Ocultos inicialmente via CSS/JS se desejar) -->
            <div id="campos-comerciante" style="display: none;">
                <div class="form-row">
                    <div class="form-grupo flex-1">
                        <label for="cnpj">CNPJ</label>
                        <div class="input-container sem-icone">
                            <input 
                            type="text" 
                            id="cnpj" 
                            name="cnpj" 
                            placeholder="00.000.000/0001-00">
                        </div>
                    </div>
            <div class="form-grupo">
                <label for="nome-loja">Nome da loja</label>
                <div class="input-container sem-icone">
                <input
                    type="text"
                    id="nome-loja"
                    name="nome_loja"
                    placeholder="Nome da sua loja">
                </div>
            </div>

                    <div class="form-grupo flex-1">
                        <label for="data-nascimento-com">Abertura / Nasc.</label>
                        <div class="input-container sem-icone">
                            <input type="date" 
                            id="data-abertura" n
                            ame="data_abertura">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Senha -->
            <div class="form-grupo">
                <label for="senha">Senha</label>
                <div class="input-container sem-icone">
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Botão Cadastrar -->
            <button type="submit" class="btn-entrar">Cadastrar</button>
        </form>

        <p class="texto-cadastro">
            Já tem uma conta? <a href="login.html" class="link-cadastro">Entrar</a>
        </p>
    </div>
    <script type="module" src="../pages/cadastro/domcadastroclienteecomerciante.js"></script>
</body>
</html>
