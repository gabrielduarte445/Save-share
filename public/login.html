<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tela de login</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="body-login">
    <div class="card-login">
    <!-- Logo de folha -->
<div class="logo-container">
            <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            </svg>
        </div>
    <h1 class="titulo">Bem-vindo!</h1>
    <p class="subtitulo">Entre para continuar</p>
    <form class="form-login">
        
        <!--Campo email-->
        <div class="form-grupo">
            <label for="email">E-mail</label>
            <div class="input-container">
                <img class="input-icon" src="https://img.icons8.com/?size=100&id=16072&format=png&color=666666" alt="Ícone carta">
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
        </div>
        
        <!--Campo senha-->
        <div class="form-grupo">
            <label for="password">Senha</label>
            <div class="input-container">
                <img class="input-icon" src="https://img.icons8.com/?size=100&id=14095&format=png&color=666666" alt="Ícone cadeado">
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div class="esqueci-senha-container">
                <a href="#" class="link-esqueci">Esqueci minha senha</a>
            </div>
        </div>

        <div class="form-grupo">
            <p>Você é:</p>
            <div class="tipo-usuario-options">
                <input type="radio" id="cliente" name="tipo_usuario" value="cliente" checked hidden>
                <label for="cliente" class="btn-tipo">Cliente</label>

                <input type="radio" id="comerciante" name="tipo_usuario" value="comerciante" hidden>
                <label for="comerciante" class="btn-tipo">Comerciante</label>
            </div>
        </div>

            <button type="submit" class="btn-entrar">Entrar</button>
            <p class="texto-cadastro">
                <a href="cadastro.html" class="link-cadastro">Criar conta</a>
            </p>
    </form>
    </div>
</div>
<script type="module" src="../pages/login/login.js"></script>
</body>
</html>
