<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Produtos</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="../pages/produtos/produtos.css">
</head>
<body class="body-app">

    <!-- Cabeçalho da página -->
    <header class="cabecalho-produtos">
        <div class="titulo-produtos">
            <h1>Meus Produtos</h1>
            <p>Gerencie os produtos cadastrados na sua loja.</p>
        </div>

        <button id="btn-adicionar-produto" class="btn-entrar btn-adicionar">
            + Adicionar Produto
        </button>
    </header>

    <!-- Área principal -->
    <main class="main-produtos">
        <section class="secao-produtos">
            <h2 class="section-title">Produtos cadastrados</h2>

            <!-- Estado vazio (mostrado enquanto não há produtos) -->
            <p id="mensagem-vazia" class="empty-message" style="display:none;">
                Nenhum produto cadastrado ainda.
            </p>

            <!-- Aqui o JS vai inserir os cards dinamicamente -->
            <div id="lista-produtos" class="grid-produtos">
                <p class="empty-message">Carregando produtos...</p>
            </div>
        </section>
    </main>

    <!-- Modal de Adicionar/Editar Produto -->
    <div id="modal-produto" class="modal-overlay" style="display:none;">
        <div class="modal-conteudo">

            <div class="modal-cabecalho">
                <h2 id="modal-titulo">Adicionar Produto</h2>
                <button type="button" id="btn-fechar-modal" class="btn-fechar-modal">&times;</button>
            </div>

            <form id="form-produto" class="form-login">

                <input type="hidden" id="produto-id" value="">

                <div class="form-grupo">
                    <label for="produto-nome">Nome do produto</label>
                    <div class="input-container sem-icone">
                        <input type="text" id="produto-nome" name="nome" placeholder="Ex: Maçã fuji" required>
                    </div>
                </div>

                <div class="form-grupo">
                    <label for="produto-descricao">Descrição</label>
                    <div class="input-container sem-icone">
                        <input type="text" id="produto-descricao" name="descricao" placeholder="Descreva o produto">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-grupo flex-1">
                        <label for="produto-valor">Preço (R$)</label>
                        <div class="input-container sem-icone">
                            <input type="number" id="produto-valor" name="valor" step="0.01" min="0" placeholder="0,00" required>
                        </div>
                    </div>

                    <div class="form-grupo flex-1">
                        <label for="produto-estoque">Estoque</label>
                        <div class="input-container sem-icone">
                            <input type="number" id="produto-estoque" name="estoque" min="0" placeholder="0" required>
                        </div>
                    </div>
                </div>

                <div class="form-grupo checklist-consumivel">
                    <label class="checklist-titulo">Verificação de consumo</label>
                    <p class="checklist-descricao">
                        Confirme os itens abaixo antes de cadastrar o produto:
                    </p>

                    <label class="checklist-item">
                        <input type="checkbox" name="check_mofo" id="check-mofo" required>
                        <span>Sem sinais de mofo, fungos ou podridão</span>
                    </label>

                    <label class="checklist-item">
                        <input type="checkbox" name="check_furos" id="check-furos" required>
                        <span>Sem furos, cortes ou perfurações na casca</span>
                    </label>

                    <label class="checklist-item">
                        <input type="checkbox" name="check_odor" id="check-odor" required>
                        <span>Sem odor estranho ou fermentado</span>
                    </label>

                    <label class="checklist-item">
                        <input type="checkbox" name="check_textura" id="check-textura" required>
                        <span>Coloração e textura dentro do esperado, mesmo com marcas estéticas</span>
                    </label>

                    <label class="checklist-item">
                        <input type="checkbox" name="check_consumo" id="check-consumo" required>
                        <span>Confirmo que o produto está próprio para consumo, apenas fora do padrão visual de mercado</span>
                    </label>
                </div>

                <button type="submit" class="btn-entrar" id="btn-salvar-produto">Salvar Produto</button>
            </form>

        </div>
    </div>
    </div>

    <script type="module" src="/pages/produtos/meus-produtos.js"></script>
</body>
</html>
