<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página Não Encontrada - Save & Share</title>

    <style media="screen">
      :root {
        --verde-primario: #2e7d32;
        --verde-escuro: #1b5e20;
        --fundo: #f4f6f8;
        --texto: #2d3748;
      }

      body { 
        background: var(--fundo); 
        color: var(--texto); 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        margin: 0; 
        padding: 20px; 
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        box-sizing: border-box;
      }

      #card-404 { 
        background: #ffffff; 
        max-width: 420px; 
        width: 100%;
        margin: 0 auto; 
        padding: 40px 32px; 
        border-radius: 20px; 
        box-shadow: 0 10px 25px rgba(46, 125, 50, 0.08);
        text-align: center;
      }

      /* Ilustração CSS - Abacate 404 */
      .abacate-container {
        width: 90px;
        height: 110px;
        background: #4caf50;
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        margin: 0 auto 20px;
        position: relative;
        border: 4px solid #2e7d32;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .abacate-polpa {
        width: 65px;
        height: 85px;
        background: #c8e6c9;
        border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .abacate-caroco {
        width: 30px;
        height: 35px;
        background: #795548;
        border-radius: 50%;
        box-shadow: inset -2px -2px 0px rgba(0,0,0,0.2);
      }

      .badge-404 {
        display: inline-block;
        background: #e8f5e9;
        color: var(--verde-primario);
        font-weight: 800;
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 20px;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      h1 { 
        font-size: 24px; 
        font-weight: 800; 
        color: #1a202c; 
        margin: 0 0 10px;
        line-height: 1.2;
      }

      p { 
        line-height: 150%; 
        margin: 0 0 28px; 
        font-size: 15px; 
        color: #718096;
      }

      .btn-retorno { 
        display: block; 
        text-align: center; 
        background: var(--verde-primario); 
        text-decoration: none; 
        color: #ffffff; 
        padding: 14px 20px; 
        border-radius: 12px; 
        font-weight: 700;
        font-size: 15px;
        box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
        transition: all 0.2s ease;
      }

      .btn-retorno:hover {
        background: var(--verde-escuro);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div id="card-404">
      <div class="abacate-container">
        <div class="abacate-polpa">
          <div class="abacate-caroco"></div>
        </div>
      </div>

      <span class="badge-404">ERRO 404</span>
      <h1>Nada por aqui!</h1>
      <p>A página que procuras não existe ou foi movida para outro endereço.</p>

      <a href="../index.html" class="btn-retorno">Voltar à Página Inicial</a>
    </div>
  </body>
</html>
