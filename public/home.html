<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>home</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="../pages/home/home.css">
</head>
<body class="body-app">
<main class="app-container">

    <header class="home-header">
        <div class="header-top-row">
            <div class="user-info">
                <p class="greeting">Olá,</p>
                <h2 class="user-name" id="user-name">...</h2>

                <div class="location-badge" id="location-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span id="location-text">Carregando endereço...</span>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
                </div>
            </div>

            <div class="header-actions">
                <a href="paginamanutencao.html" class="header-btn" aria-label="Carrinho">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
                </a>

                <a href="paginamanutencao.html" class="header-btn" aria-label="Perfil">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </a>
            </div>
        </div>

        <form class="search-form" id="search-form">
            <div class="search-input-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" name="q" id="search-input" placeholder="Buscar produtos...">
            </div>
        </form>
    </header>

    <nav class="categories-nav">
        <a href="paginamanutencao.html" class="category-chip active" data-categoria="todos">Todos</a>
        <a href="paginamanutencao.html" class="category-chip" data-categoria="promocoes">Promoções</a>
        <a href="paginamanutencao.html" class="category-chip" data-categoria="padaria">Padaria</a>
        <a href="paginamanutencao.html" class="category-chip" data-categoria="hortifruti">Hortifruti</a>
    </nav>

    <section class="products-section">
        <h3 class="section-title">Produtos próximos</h3>
        <div class="products-list" id="products-container">
            <p class="empty-message">Nenhum produto cadastrado no momento.</p>
        </div>
    </section>

</main>
<script type="module" src="/pages/home/home.js"></script>
</body>
</html>
